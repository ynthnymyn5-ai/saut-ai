<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080812">
<title>SAUT AI — غير متصل</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(120% 80% at 50% 0%, #1b1838 0%, #080812 60%); color: #fff; font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  .card { max-width: 380px; width: 100%; padding: 32px 24px; border: 1px solid rgba(255,255,255,.08); border-radius: 24px; background: rgba(17,17,33,.7); }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: #A1A1B5; line-height: 1.7; margin: 0 0 6px; font-size: 15px; }
  p[lang=en] { direction: ltr; font-size: 13px; }
  button { margin-top: 18px; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600; color: #fff; background: linear-gradient(135deg, #8B5CF6, #38BDF8); cursor: pointer; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="SAUT AI">
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>موظفوك الأذكياء ما زالوا يعملون ويردّون على عملائك. ستظهر لوحة التحكم عند عودة الاتصال.</p>
    <p lang="en">You're offline. Your AI employees keep answering customers — the dashboard returns when you reconnect.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة · Retry</button>
  </main>
</body>
</html>
