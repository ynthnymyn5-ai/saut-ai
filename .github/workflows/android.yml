name: android
# Builds the SAUT AI Android app (Capacitor shell around the live web app).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls /usr/local/lib/android/sdk/platforms | tail -3
      - name: Install Capacitor
        run: npm install --no-audit --no-fund 2>&1 | tee ../build-android.log
      - name: Create Android project
        run: |
          npx cap add android 2>&1 | tee -a ../build-android.log
          npm run assets 2>&1 | tee -a ../build-android.log || echo "assets step failed (default icon kept)" | tee -a ../build-android.log
          # permissions, allowBackup=false, App Links and the app version (scripts/patch-android.mjs)
          node scripts/patch-android.mjs 2>&1 | tee -a ../build-android.log
          test ${PIPESTATUS[0]} -eq 0
          npx cap sync android 2>&1 | tee -a ../build-android.log
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tail -40 | tee -a ../../build-android.log
      - name: Build signed release APK + bundle (if keystore secrets exist)
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          echo "$KS" | base64 -d > release.jks
          ./gradlew assembleRelease bundleRelease --no-daemon -Pandroid.injected.signing.store.file=$PWD/release.jks -Pandroid.injected.signing.store.password="$KS_PASS" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tail -20 | tee -a ../../build-android.log
          # SHA-256 of the release key: put it in ANDROID_CERT_SHA256 on Vercel so App Links verify
          keytool -list -v -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" | grep -i "SHA256:" | sed 's/^\s*/release cert /' | tee -a ../../build-android.log
          rm -f release.jks
      - name: Publish to android-build branch
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/saut-ai.apk 2>/dev/null || true
          cp mobile/android/app/build/outputs/apk/release/app-release.apk /tmp/out/saut-ai-release.apk 2>/dev/null || true
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab /tmp/out/saut-ai.aab 2>/dev/null || true
          cp build-android.log /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/commit.txt
          echo '{"git":{"deploymentEnabled":false}}' > /tmp/out/vercel.json
          cd /tmp/out && git init -q -b android-build && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "android build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saut-ai-android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
