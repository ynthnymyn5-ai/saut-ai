<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جميع الدورات | معهد تيك ماركن</title>
  <meta name="description" content="تصفّح دورات معهد تيك ماركن في التدريب المهني واللغات والتقوية الدراسية.">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body data-page="courses">
<!--#header-->
<main id="main">
  <section class="page-hero">
    <div class="container">
      <div class="crumbs"><a href="/">الرئيسية</a> / الدورات</div>
      <h1>جميع الدورات</h1>
      <p>ابحث واختر من بين برامجنا في أقسام المعهد الثلاثة، وسجّل مباشرة.</p>
    </div>
  </section>
  <section class="block">
    <div class="container">
      <div class="filters">
        <div class="pill-group" id="dept-pills" role="group" aria-label="تصفية حسب القسم"></div>
        <label class="search">
          <span class="hp">بحث</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="course-search" placeholder="ابحث عن دورة…" aria-label="ابحث عن دورة">
        </label>
      </div>
      <p class="muted" id="course-count" aria-live="polite"></p>
      <div class="grid grid-3" id="course-list"><div class="empty" style="grid-column:1/-1">جارٍ التحميل…</div></div>
    </div>
  </section>
</main>
<!--#footer-->
<script src="/js/main.js" defer></script>
</body>
</html>
