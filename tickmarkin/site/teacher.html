<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>بوابة المعلم | تيك ماركن</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body class="admin-body">
  <header class="admin-top">
    <div class="container nav-wrap">
      <a href="/" class="brand brand-light">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tmg-t" x1="6" y1="4" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4466ff"/><stop offset=".55" stop-color="#5a3df0"/><stop offset="1" stop-color="#7c2fe0"/></linearGradient><radialGradient id="tmh-t" cx="14" cy="6" r="30" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="tmd-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd25e"/><stop offset="1" stop-color="#ff8a2a"/></linearGradient></defs><rect x="1" y="1" width="46" height="46" rx="14" fill="url(#tmg-t)"/><rect x="1" y="1" width="46" height="46" rx="14" fill="url(#tmh-t)"/><path d="M9 32.6c4.8-2.7 9.8-2.7 15 .7 5.2-3.4 10.2-3.4 15-.7v4.2c-4.8-2.5-9.8-2.5-15 .9-5.2-3.4-10.2-3.4-15-.9z" fill="#fff" opacity=".62"/><path d="M14.8 20.6l6.1 6.2 12.9-14" fill="none" stroke="#fff" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="37.4" cy="9.6" r="3" fill="url(#tmd-t)"/></svg>
        <span class="brand-text"><strong>Tick<span class="wm-accent">mark</span>in</strong><small>بوابة المعلم</small></span>
      </a>
      <button class="btn btn-ghost btn-sm hidden" id="logout">تسجيل الخروج</button>
    </div>
  </header>
  <main id="main" class="container" style="padding:28px 0 60px">
    <section id="login-view" class="hidden">
      <form class="form-card login-box" id="login-form" novalidate>
        <h1 style="font-size:1.5rem">دخول المعلمين</h1>
        <p class="muted">ادخل برقم جوالك وكلمة المرور التي استلمتها من إدارة المعهد.</p>
        <div class="form-alert hidden" role="alert"></div>
        <div class="field"><label for="phone">رقم الجوال</label><input id="phone" name="phone" type="tel" inputmode="tel" dir="ltr" autocomplete="username" placeholder="9xxxxxxx" required></div>
        <div class="field" style="margin-top:12px"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:18px">دخول</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <div class="view-head"><div><h1 id="hello"></h1><p class="muted" id="summary"></p></div>
        <div class="view-actions"><input type="search" id="q" placeholder="بحث عن طالب" aria-label="بحث عن طالب" style="min-width:220px"></div></div>
      <div id="classes"></div>
    </section>
  </main>
  <script src="/js/teacher.js" defer></script>
</body>
</html>
